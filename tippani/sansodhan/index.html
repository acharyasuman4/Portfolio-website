        let debounceTimer;

        // --- UTILS ---
        const toNepali = (num) => { 
            if (!num && num !== 0) return ""; 
            const n = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९']; 
            return num.toString().replace(/[0-9]/g, s => n[s]); 
        };
        
        function nepaliJoin(arr) { 
            if (!arr.length) return ""; 
            if (arr.length === 1) return arr[0]; 
            const last = arr.pop(); 
            return arr.join(', ') + ' र ' + last; 
        }

        function autoFormatDate(el) {
            let val = el.value;
            val = toNepali(val);
            val = val.replace(/[\.\/,-]/g, '।');
            el.value = val;
            scheduleUpdate();
        }

        function scheduleUpdate() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { updateAll(); saveToLocal(); }, 300); }

        // --- APPLICANT LOGIC ---
        function updatePlaceholders() {
            const rel = document.getElementById('in_rel_type').value;
            if (rel === 'wife') {
                document.getElementById('in_gf').placeholder = "ससुराको नाम";
                document.getElementById('in_f').placeholder = "पतिको नाम";
            } else {
                document.getElementById('in_gf').placeholder = "बाजेको नाम";
                document.getElementById('in_f').placeholder = "बाबुको नाम";
            }
        }

        function addApplicant() {
            const name = document.getElementById('in_app_name').value.trim();
            const relType = document.getElementById('in_rel_type').value;
            const dist = document.getElementById('in_dist').value.trim();
            const addr = document.getElementById('in_addr').value.trim();
            const gf = document.getElementById('in_gf').value.trim();
            const f = document.getElementById('in_f').value.trim();

            if (!name) { alert("निवेदकको नाम अनिवार्य छ।"); return; }

            applicants.push({ name, relType, dist, addr, gf, f });
            document.getElementById('in_app_name').value = "";
            document.getElementById('in_app_name').focus();
            renderApplicantUI(); scheduleUpdate();
        }

        function renderApplicantUI() {
            const relMap = { son: 'छोरा', daughter: 'छोरी', wife: 'पत्नी' };
            document.getElementById('applicant-list-ui').innerHTML = applicants.map((app, i) => `
                <div class="list-item">
                    <span>${app.name} (${relMap[app.relType]})</span>
                    <span class="del-btn" onclick="applicants.splice(${i},1); renderApplicantUI(); scheduleUpdate();">×</span>
                </div>
            `).join('');
        }

        // --- LAND LOGIC ---
        function addLand(type) {
            const vdc = document.getElementById('l_vdc').value;
            const ward = document.getElementById('l_ward').value;
            const kitta = toNepali(document.getElementById('l_kitta').value.trim());
            
            if (!kitta) return;
            let loc = lands.find(l => l.vdc === vdc && l.ward === ward);
            if (loc) { loc.kittas.push(kitta); } else { lands.push({ vdc, ward, kittas: [kitta] }); }
            document.getElementById('l_kitta').value = "";
            if (type === 'new') { 
                document.getElementById('l_vdc').value = ""; 
                document.getElementById('l_ward').value = ""; 
                document.getElementById('l_vdc').focus(); 
            } else { 
                document.getElementById('l_kitta').focus(); 
            }
            renderLandUI(); scheduleUpdate();
        }

        function renderLandUI() {
            document.getElementById('land-list-ui').innerHTML = lands.map((l, i) => `
                <div style="background:#f1f5f9; border:1px solid #cbd5e1; padding:4px 8px; border-radius:4px; font-size:11px; display:flex; align-items:center; gap:5px;">
                    <b>${l.vdc}-${l.ward}:</b> ${l.kittas.join(',')}
                    <button onclick="lands.splice(${i},1); renderLandUI(); scheduleUpdate();" style="color:red; font-weight:bold; border:none; background:none; cursor:pointer;">✕</button>
                </div>`).join('');
        }

        function switchView(view) {
            currentView = view;
            ['btn_aadesh', 'btn_suchana', 'btn_chithi'].forEach(b => document.getElementById(b).className = 'tab-btn');
            document.getElementById('btn_' + view).className = 'tab-btn tab-active';
            updateAll();
        }

        function getData() {
            // निवेदकको लिस्ट खाली भएमा इनपुट बक्सको भ्यालु लिने
            let finalApplicants = [...applicants];
            if (finalApplicants.length === 0 && document.getElementById('in_app_name').value) {

            const generatedAuth = `श्री ${local} ${ward} नं. वडा कार्यालय`;

            return {

                cn: toNepali(document.getElementById('in_c_n').value) || ".......",
                off: document.getElementById('in_officer').value,
                dt: document.getElementById('in_date').value || ".......",
                mis: toNepali(document.getElementById('in_misil').value) || ".......",
                
                applicants: finalApplicants,
                
                ownerName: document.getElementById('in_owner_name').value || ".......",
                shortDesc: document.getElementById('in_short_desc').value || ".......",
                fullDesc: document.getElementById('in_full_desc').value || ".......",
                
                tn: document.getElementById('in_t_n').value || ".......",
                ta: document.getElementById('in_t_a').value || ".......",
                    aadeshFinal: document.getElementById('in_aadesh_final').value || "",
    suchanaFinal: document.getElementById('in_suchana_final').value || "",

                
                // नयाँ: इनपुटबाट सिधै लिने
                local: local,
                ward: ward,
                sa: generatedAuth, // यहाँ अटोमेटिक बन्छ
                
                papr: document.getElementById('in_paper').value || "........."
            };
        }     
function generateTexts(d) {
    const gData = JSON.parse(localStorage.getItem('global_office_settings')) || {};
    const globalDist = gData.def_dist || "सिन्धुपाल्चोक"; // यो जग्गाको विवरणको लागि

    let groupedApps = {};
    let appDist = d.applicants.length > 0 ? d.applicants[0].dist : globalDist; // निवेदकको जिल्ला
    let address = d.applicants.length > 0 ? d.applicants[0].addr : ".......";

    if (d.applicants.length > 0) {
        d.applicants.forEach(app => {
            let key = (app.relType === 'wife') ? `${app.gf}को बुहारी ${app.f}को पत्नी` : 
                      (app.relType === 'daughter') ? `${app.gf}को नातिनी ${app.f}को छोरी` : 
                      `${app.gf}को नाति ${app.f}को छोरा`;
            if (!groupedApps[key]) groupedApps[key] = [];
            groupedApps[key].push(app.name);
        });
    } else {
        groupedApps["....... को नाति ....... को छोरा"] = ["......."];
    }

    let appStrings = [];
    for (let [desc, names] of Object.entries(groupedApps)) {
        appStrings.push(`${desc} ${nepaliJoin(names)}`);
    }

    const landText = lands.length > 0 ? lands.map(l => `साविक ${l.vdc} वडा नं. ${toNepali(l.ward)} को कि.नं. ${nepaliJoin([...l.kittas])}`).join(', ') : "साविक ....... वडा नं. ....... को कि.नं. .......";
    const landGrammar = lands.length > 1 ? "का जग्गाहरूमा" : "को जग्गामा";

    return { 
        appDist, globalDist, address,
        applicantFullDesc: nepaliJoin(appStrings),
        applicantNamesOnly: d.applicants.length > 0 ? nepaliJoin(d.applicants.map(a => a.name)) : ".......",
        landText, landGrammar,
        applicantLabel: d.applicants.length > 1 ? "निवेदकहरू" : "निवेदक"
    };
}


function applyGlobalSettings() {
    const data = JSON.parse(localStorage.getItem('global_office_settings'));
    if (!data) return;

    // १. इन्पुट बक्समा डिफ्ल्ट जिल्ला राख्ने (यदि खाली छ भने)
    if (!document.getElementById('in_dist').value) {
        document.getElementById('in_dist').value = data.def_dist || "सिन्धुपाल्चोक";
    }

    // २. व्यहोरा भित्र रहेका .global-dist क्लासलाई अपडेट गर्ने
    document.querySelectorAll('.global-dist').forEach(el => {
        el.innerText = data.def_dist || "सिन्धुपाल्चोक";
    });
}

function renderModalOffices() {
    const html = offices.sort((a, b) => a.sn - b.sn).map(o => `
        <tr>
            <td align="center"><input type="checkbox" ${o.checked ? 'checked' : ''} onchange="updateOfficeData(${o.id}, 'checked', this.checked)"></td>
            <td><input type="number" class="input-box" value="${o.sn}" style="width:60px;" onchange="changeOfficeSn(${o.id}, this.value)"></td>
            <td>
                <select class="input-box" onchange="updateOfficeData(${o.id}, 'type', this.value)">
                    <option value="main" ${o.type === 'main' ? 'selected' : ''}>मुख्य पत्र</option>
                    <option value="cc" ${o.type === 'cc' ? 'selected' : ''}>बोधार्थ</option>
                </select>
            </td>
            <td><input type="text" class="input-box" value="${o.name}" style="width:100%;" oninput="updateOfficeData(${o.id}, 'name', this.value)"></td>
            <td><input type="text" class="input-box" value="${o.addr}" style="width:100%;" oninput="updateOfficeData(${o.id}, 'addr', this.value)"></td>
            <td><textarea class="input-box" oninput="updateOfficeData(${o.id}, 'desc', this.value)">${o.desc}</textarea></td>
            <td align="center"><button onclick="deleteOffice(${o.id})" style="color:red; cursor:pointer; background:none; border:none;">✕</button></td>
        </tr>
    `).join('');
    document.getElementById('modal-office-list').innerHTML = html;
}

function openOfficeModal() {
    document.getElementById('officeModal').style.display = 'block';
    renderModalOffices(); // मोडल खुल्दा विवरण भर्ने
}

function addNewOffice() {
    const nextSn = offices.length > 0 ? Math.max(...offices.map(o => o.sn)) + 1 : 1;
    offices.push({ id: Date.now(), sn: nextSn, type: 'cc', name: 'नयाँ कार्यालय', addr: getSettings().def_dist, desc: 'सूचना टाँस गरी जानकारी पठाइदिनुहुन ।', checked: true });
    renderModalOffices();
}

function deleteOffice(id) {
    if (confirm("के हटाउन चाहनुहुन्छ?")) { offices = offices.filter(o => o.id !== id); renderModalOffices(); }
}

function updateOfficeData(id, field, val) { const off = offices.find(o => o.id === id); if (off) off[field] = val; }

function changeOfficeSn(id, newSn) {
    newSn = parseInt(newSn);
    let oldSn = offices.find(o => o.id === id).sn;
    offices.forEach(o => {
        if (o.id === id) o.sn = newSn;
        else if (oldSn < newSn && o.sn > oldSn && o.sn <= newSn) o.sn--;
        else if (oldSn > newSn && o.sn >= newSn && o.sn < oldSn) o.sn++;
    });
    renderModalOffices();
}

// १. मोडल भित्र नयाँ कार्यालय थप्ने
function addNewOffice() {
    const nextSn = offices.length > 0 ? Math.max(...offices.map(o => o.sn)) + 1 : 1;
    offices.push({ 
        id: Date.now(), 
        sn: nextSn, 
        type: 'cc', 
        name: 'नयाँ कार्यालय', 
        addr: getSettings().def_dist, 
        desc: 'सूचना टाँस गरी जानकारी पठाइदिनुहुन ।', 
        checked: true 
    });
    renderModalOffices();
}

// २. कार्यालय हटाउने
function deleteOffice(id) {
    if (confirm("के तपाइँ यो कार्यालय हटाउन चाहनुहुन्छ?")) {
        offices = offices.filter(o => o.id !== id);
        renderModalOffices();
    }
}

// ३. डेटा अपडेट गर्ने (Checkbox, Text, Type)
function updateOfficeData(id, field, val) {
    const off = offices.find(o => o.id === id);
    if (off) off[field] = val;
    // नोट: यहाँ updateAll() कल नगर्नुहोस्, closeOfficeModal मा मात्र गर्नुहोस्
}

// ४. क्रम (SN) परिवर्तन गर्ने लजिक
function changeOfficeSn(id, newSn) {
    newSn = parseInt(newSn);
    let oldSn = offices.find(o => o.id === id).sn;
    offices.forEach(o => {
        if (o.id === id) o.sn = newSn;
        else if (oldSn < newSn && o.sn > oldSn && o.sn <= newSn) o.sn--;
        else if (oldSn > newSn && o.sn >= newSn && o.sn < oldSn) o.sn++;
    });
    renderModalOffices();
}

// ५. इन्पुट प्यानलमा कुन कुन कार्यालय छानिएका छन् भनेर देखाउने
function updateOfficeSummary() {
    const selected = offices.filter(o => o.checked).map(o => o.name.replace('श्री ', '').replace(',', '')).join(', ');
    const summaryDiv = document.getElementById('selected-office-summary');
    if(summaryDiv) {
        summaryDiv.innerHTML = selected ? `<b>छानिएका:</b> <span style="color:#1e40af;">${selected}</span>` : `<span style="color:red;">कुनै कार्यालय छानिएको छैन !</span>`;
    }
}

// ६. मोडल बन्द गर्दा सेभ र अपडेट गर्ने (परिमार्जित)
function closeOfficeModal() {
    document.getElementById('officeModal').style.display = 'none';
    offices.sort((a, b) => a.sn - b.sn);
    localStorage.setItem('sanshodhan_offices', JSON.stringify(offices));
    updateOfficeSummary(); // बाहिरको विवरण अपडेट गर्न
    updateAll(); // प्रिभ्यु अपडेट गर्न
}

function resetData() {
    if (confirm("के तपाइँ सबै विवरण रिसेट गर्न चाहनुहुन्छ? (जिल्ला प्रशासनको ठेगाना सुरक्षित रहनेछ)")) {
        const dao = offices.find(o => o.name.includes("जिल्ला प्रशासन कार्यालय"));
        const savedDaoAddr = dao ? dao.addr : getSettings().addr;
        localStorage.removeItem('sanshodhan_final_v1');
        // Offices लाई पनि डिफ्ल्टमा लैजाने तर ठेगाना जोगाउने
        offices[0].addr = savedDaoAddr; 
        localStorage.setItem('sanshodhan_offices', JSON.stringify(offices));
        location.reload();
    }
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {

        navigator.serviceWorker.register('/sw.js')
            .then(reg => {
                console.log('Service Worker Registered for this page!');
                
                // नयाँ अपडेट चेक गर्ने लजिक
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            console.log('नयाँ अपडेट उपलब्ध छ! कृपया पेज रिलोड गर्नुहोस्।');
                        }
                    };
                };
            })
            .catch(err => console.log('Service Worker Registration Failed:', err));
    });
